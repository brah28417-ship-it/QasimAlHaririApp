name: بناء تطبيق APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: فك ملفات المشروع
        run: |
          mkdir buildsrc
          unzip -q QasimAlHariri_APK_Project.zip -d buildsrc

      - name: بناء APK
        run: |
          cd buildsrc/QasimAlHariri_APK_Project
          gradle :app:assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: QasimAlHariri-APK
          path: buildsrc/QasimAlHariri_APK_Project/app/build/outputs/apk/debug/app-debug.apk
