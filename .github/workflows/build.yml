name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o QasimAlHariri_APK_Project_icon_updated.zip
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build
        run: |
          ./gradle-8.10.2/bin/gradle -p QasimAlHariri_APK_Project :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: qasim-alhariri-apk
          path: QasimAlHariri_APK_Project/app/build/outputs/apk/debug/app-debug.apk
